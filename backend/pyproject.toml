[project]
name = "code-arena-backend"
version = "0.1.0"
description = "Code Arena - Competitive Programming Gamification Platform API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

# B008: Function call in argument defaults is idiomatic FastAPI for Depends()
# N818: Custom exceptions use AppException suffix pattern, not Error suffix
# E712: SQLAlchemy .where(col == True) is valid SQL, not a Python truth check
# B904: raise-from style — existing code uses direct raise, fixing incrementally
# B017: pytest.raises(Exception) in tests — legitimate for verifying any-exception cases
# B007: unused loop var in tests — _ prefix convention not enforced
# UP038: isinstance(x, (int, float)) — clearer than X | Y for type tuples
# SIM117: nested with in complex test fixtures — combining harms readability
# SIM102: nested if in mock factories — combining harms readability
ignore = ["B008", "N818", "E712", "B904", "B017", "B007", "SIM117", "SIM102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=80 --cov-report=term-missing --cov-report=json"

[tool.coverage.run]
omit = ["migrations/*", "app/core/config.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mutmut]
paths_to_mutate = [
    "app/services/elo_service.py",
    "app/services/pp_service.py",
    "app/services/time_factor_service.py",
]
runner = "python -m pytest tests/test_elo_property.py tests/test_pp_property.py tests/test_time_factor_property.py tests/test_elo_service.py tests/test_pp_service.py tests/test_time_factor_service.py tests/test_s_value.py tests/test_k_factor.py tests/test_overkill_bonus.py tests/test_time_factor_prediction.py --no-cov --ignore=tests/integration -x -q -p no:hypothesispytestplugin"
pytest_add_cli_args = ["--ignore=tests/integration", "--no-cov", "-p", "no:hypothesispytestplugin"]
pytest_add_cli_args_test_selection = ["tests/test_elo_property.py", "tests/test_pp_property.py", "tests/test_time_factor_property.py", "tests/test_elo_service.py", "tests/test_pp_service.py", "tests/test_time_factor_service.py", "tests/test_s_value.py", "tests/test_k_factor.py", "tests/test_overkill_bonus.py", "tests/test_time_factor_prediction.py"]
also_copy = ["app/"]
